<text x="24" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8A8FA3">Research Analyst Assistant Bot</text><text x="24" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E8E6E1">An AI research companion built on Retrieval-</text><text x="24" y="133" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E8E6E1">Augmented Generation. Search papers, get a</text><text x="24" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E8E6E1">structured summary, and ask questions answered</text><text x="24" y="175" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E8E6E1">strictly from the paper&#x27;s own text, with source</text><text x="24" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E8E6E1">passages shown.</text><rect x="24" y="229" width="37.8" height="24" rx="12" fill="#F2B15C" fill-opacity=".1" stroke="#F2B15C" stroke-opacity=".35"/><text x="42.9" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F2B15C">RAG</text><rect x="69.8" y="229" width="77.4" height="24" rx="12" fill="#F2B15C" fill-opacity=".1" stroke="#F2B15C" stroke-opacity=".35"/><text x="108.5" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F2B15C">LangChain</text><rect x="155.2" y="229" width="70.8" height="24" rx="12" fill="#F2B15C" fill-opacity=".1" stroke="#F2B15C" stroke-opacity=".35"/><text x="190.6" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#F2B15C">ChromaDB</text><rect x="234.0" y="229" width="77.4" height="24" rx="12" fill="#F2B15C" fill-opacity=".1" stroke="#F2B15C" stroke-opacity